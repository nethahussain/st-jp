<style>
:root { --ink:#1b1b1f; --muted:#5d5d66; --bg:#f6f6f4; --card:#fff; --border:#d9d9de; --accent:#2f5bd3; --bad:#b3261e; }
@media (prefers-color-scheme: dark) { :root { --ink:#ececf0; --muted:#a2a2ad; --bg:#151517; --card:#1f1f23; --border:#38383f; --accent:#7f9cff; --bad:#ff8a80; } }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,sans-serif; padding:16px; }
form { width:100%; max-width:340px; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:24px; }
h1 { font-size:20px; margin:0 0 16px; }
label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
input[type=text], input[type=password] { width:100%; font:inherit; padding:9px 11px; border:1px solid var(--border); border-radius:8px; background:transparent; color:inherit; }
.rem { display:flex; gap:8px; align-items:center; color:var(--muted); font-size:14px; margin-top:14px; }
button { margin-top:18px; width:100%; font:inherit; font-weight:600; padding:10px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
#msg { min-height:20px; margin-top:12px; font-size:14px; color:var(--bad); }
</style></head><body>

</form>

const KEY = "jpKey:" + D.salt;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const LOGOUT = '<button id="jpLogout" style="position:fixed;bottom:12px;right:12px;z-index:9999;font:13px system-ui,sans-serif;padding:6px 10px;border-radius:8px;border:1px solid #999;background:#fff;color:#111;cursor:pointer;opacity:.85">Log out</button>' +
  '<script>document.getElementById("jpLogout").onclick=async()=>{try{localStorage.removeItem(' + JSON.stringify(KEY) + ')}catch(e){}try{await navigator.credentials.preventSilentAccess()}catch(e){}location.reload()}<\/script>';
// decrypt() throws on a wrong key (AES-GCM authentication fails); show() replaces this page with the dashboard
async function decrypt(rawKey) {
  const key = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(D.iv) }, key, b64(D.ct)));
}
function show(html) {
  document.open(); document.write(html.replace(/<\/body>/i, LOGOUT + "</body>")); document.close();
}
async function derive(user, pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveBits"]);
  const salt = new Uint8Array([...b64(D.salt), ...new TextEncoder().encode(user.trim().toLowerCase())]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt, iterations: D.iter }, base, 256));
}
const remember = raw => { try { localStorage.setItem(KEY, btoa(String.fromCharCode(...raw))); } catch (e) {} };
// Chrome's password manager: offer to save the login after it worked, and sign in silently with a saved one
const canCred = "PasswordCredential" in window && navigator.credentials;
const withTimeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(r, ms))]);
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) { try { show(await decrypt(b64(saved))); return; } catch (e) { try { localStorage.removeItem(KEY); } catch (e2) {} } }
  if (canCred) {
    try {
      const c = await navigator.credentials.get({ password: true, mediation: "silent" });
      if (c && c.password) show(await decrypt(await derive(c.id, c.password)));
    } catch (e) {}
  }
})();
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  msg.textContent = "";
  const btn = e.target.querySelector("button"); btn.disabled = true; btn.textContent = "Opening…";
  const user = document.getElementById("u").value, pass = document.getElementById("p").value;
  let html;
  try {
    const raw = await derive(user, pass);
    html = await decrypt(raw);
    if (document.getElementById("r").checked) remember(raw);
  } catch (err) {
    msg.textContent = "Wrong username or password.";
    btn.disabled = false; btn.textContent = "Log in";
    return;
  }
  if (canCred) { try { await withTimeout(navigator.credentials.store(new PasswordCredential({ id: user.trim(), password: pass, name: "Jourpass" })), 1500); } catch (e) {} }
  show(html);
});
