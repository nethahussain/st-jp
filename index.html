<style>
:root { --ink:#1b1b1f; --muted:#5d5d66; --bg:#f6f6f4; --card:#fff; --border:#d9d9de; --accent:#2f5bd3; --bad:#b3261e; }
@media (prefers-color-scheme: dark) { :root { --ink:#ececf0; --muted:#a2a2ad; --bg:#151517; --card:#1f1f23; --border:#38383f; --accent:#7f9cff; --bad:#ff8a80; } }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,sans-serif; padding:16px; }
form { width:100%; max-width:340px; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:24px; }
h1 { font-size:20px; margin:0 0 16px; }
label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
input[type=text], input[type=password] { width:100%; font:inherit; padding:9px 11px; border:1px solid var(--border); border-radius:8px; background:transparent; color:inherit; }
.rem { display:flex; gap:8px; align-items:center; color:var(--muted); font-size:14px; margin-top:14px; }
button { margin-top:18px; width:100%; font:inherit; font-weight:600; padding:10px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
#msg { min-height:20px; margin-top:12px; font-size:14px; color:var(--bad); }
[hidden] { display:none !important; }
#jpFrame { position:fixed; inset:0; width:1px; min-width:100%; height:100%; border:0; background:transparent; } /* width:1px + min-width keeps iOS Safari from widening the frame */
#jpLogout { position:fixed; bottom:12px; right:12px; z-index:9999; font:13px system-ui,sans-serif; padding:6px 10px; border-radius:8px; border:1px solid #999; background:#fff; color:#111; cursor:pointer; opacity:.85; width:auto; margin:0; font-weight:400; }

const KEY = "jpKey:" + D.salt;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
// decrypt() throws on a wrong key (AES-GCM authentication fails). show() puts the decrypted dashboard in
// a full-window frame of its own, so its scripts run in a fresh page (writing it into this page with
// document.write could append it under the login box, or clash with an earlier copy and leave it empty).
async function decrypt(rawKey) {
  const key = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(D.iv) }, key, b64(D.ct)));
}
let shown = false;
function show(html) {
  if (shown) return;
  shown = true;
  const frame = document.createElement("iframe");
  frame.id = "jpFrame";
  frame.title = "Jourpass dashboard";
  frame.srcdoc = html;
  const out = document.createElement("button");
  out.id = "jpLogout";
  out.type = "button";
  out.textContent = "Log out";
  out.onclick = async () => {
    try { localStorage.removeItem(KEY); } catch (e) {}
    try { await navigator.credentials.preventSilentAccess(); } catch (e) {}
    location.reload();
  };
  document.body.replaceChildren(frame, out);
}
const showForm = () => { if (shown) return; const f = document.getElementById("f"); f.hidden = false; document.getElementById("u").focus(); };
async function derive(user, pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveBits"]);
  const salt = new Uint8Array([...b64(D.salt), ...new TextEncoder().encode(user.trim().toLowerCase())]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt, iterations: D.iter }, base, 256));
}
